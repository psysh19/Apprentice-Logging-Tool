<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Apprenticeship Activity Log{% endblock %}</title>
  <style>
    :root {
      --bg: #eef1f4;
      --surface: #ffffff;
      --ink: #1b2430;
      --muted: #5b6675;
      --faint: #8b95a3;
      --line: #dde2e8;
      --accent: #0d7d72;        /* teal */
      --accent-ink: #0a5c54;
      --accent-wash: #e3f2f0;
      --focus: #0d7d72;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(27,36,48,.05), 0 6px 24px rgba(27,36,48,.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent-ink); }

    .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px 64px; }

    /* Header */
    .masthead {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .masthead-inner {
      max-width: 860px; margin: 0 auto; padding: 16px 20px;
      display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
      flex-wrap: wrap;
    }
    .eyebrow {
      font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--accent-ink); font-weight: 600; margin: 0 0 2px;
    }
    .masthead h1 { font-size: 19px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
    .page-tag { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .page-tag b { color: var(--ink); font-weight: 600; }

    /* Page strip */
    .strip {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      margin: 20px 0 8px;
    }
    .strip .lbl { font-size: 12px; color: var(--faint); margin-right: 4px; }
    .dot {
      width: 30px; height: 30px; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px; text-decoration: none;
      border: 1px solid var(--line); background: var(--surface); color: var(--muted);
    }
    .dot:hover { border-color: var(--accent); color: var(--accent-ink); }
    .dot.current { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-top: 14px;
    }

    .field { margin-bottom: 18px; }
    .field:last-child { margin-bottom: 0; }
    label.lab { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 6px; }
    .hint { font-size: 12px; color: var(--faint); font-weight: 400; }

    input[type="text"], input[type="datetime-local"], textarea {
      width: 100%; font: inherit; color: var(--ink);
      padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
      background: #fbfcfd;
    }
    textarea { resize: vertical; min-height: 84px; }
    input:focus, textarea:focus {
      outline: none; border-color: var(--focus);
      box-shadow: 0 0 0 3px var(--accent-wash);
      background: #fff;
    }

    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .row > .field { flex: 1 1 200px; margin-bottom: 18px; }

    /* Toggle checkboxes */
    .toggles { display: flex; gap: 12px; flex-wrap: wrap; }
    .toggle {
      display: flex; align-items: center; gap: 10px;
      border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px;
      flex: 1 1 240px; cursor: pointer; background: #fbfcfd;
    }
    .toggle:hover { border-color: var(--accent); }
    .toggle input { width: 17px; height: 17px; accent-color: var(--accent); }
    .toggle .t-text { font-size: 13.5px; }
    .toggle .t-text small { display: block; color: var(--faint); font-size: 11.5px; }

    /* KSB grid */
    .ksb-group { margin-top: 18px; }
    .ksb-group h3 {
      font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin: 0 0 10px; font-weight: 600;
      border-bottom: 1px solid var(--line); padding-bottom: 6px;
    }
    .ksb-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .ksb {
      display: flex; gap: 9px; align-items: flex-start;
      padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
      background: #fbfcfd; cursor: pointer; font-size: 13px;
    }
    .ksb:hover { border-color: var(--accent); background: #fff; }
    .ksb input { margin-top: 2px; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
    .ksb .code { font-weight: 700; color: var(--accent-ink); margin-right: 5px; white-space: nowrap; }
    .ksb .desc { color: var(--muted); }
    .ksb:has(input:checked) { background: var(--accent-wash); border-color: var(--accent); }

    .count { font-size: 12px; color: var(--muted); margin-left: 8px; font-weight: 400; text-transform: none; letter-spacing: 0; }

    /* Footer / actions */
    .actions {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-top: 22px; flex-wrap: wrap;
    }
    .nav-btns { display: flex; gap: 8px; }
    .btn {
      font: inherit; font-weight: 600; font-size: 14px;
      padding: 10px 18px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent-ink); }
    .btn[aria-disabled="true"] { opacity: .4; pointer-events: none; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent-ink); color: #fff; }

    .save-note { font-size: 13px; color: var(--accent-ink); }

    .footnote { font-size: 12px; color: var(--faint); margin-top: 24px; text-align: center; }

    @media (max-width: 560px) {
      .ksb-grid { grid-template-columns: 1fr; }
      .card { padding: 18px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .dot, .btn, .ksb, .toggle { transition: all .12s ease; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div>
        <p class="eyebrow">Data Science Apprenticeship</p>
        <h1>Work Activity Log</h1>
      </div>
      <div class="page-tag">Activity <b>{{ page }}</b> of {{ total }}</div>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
